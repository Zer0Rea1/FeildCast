port: 7880

rtc:
  tcp_port: 7881
  port_range_start: 50000
  port_range_end: 60000
  # Must be true on VPS/cloud — LiveKit needs to know its public IP for ICE candidates
  use_external_ip: true

# Keys are injected from environment variables at runtime
# Set LIVEKIT_API_KEY and LIVEKIT_API_SECRET in infra/.env
keys:
  ${LIVEKIT_API_KEY}: ${LIVEKIT_API_SECRET}

room:
  # Auto-delete empty rooms after 5 minutes
  empty_timeout: 300
  # 1 anchor + up to 5 reporters per conference
  max_participants: 10

logging:
  level: info
  json: true

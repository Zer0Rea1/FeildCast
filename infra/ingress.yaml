# LiveKit Ingress — receives RTMP from FFmpeg and publishes into LiveKit room
# Keys must match livekit.yaml
api_key: ${LIVEKIT_API_KEY}
api_secret: ${LIVEKIT_API_SECRET}

# Internal Docker network — livekit container is named "livekit"
ws_url: ws://livekit:7880

rtmp_port: 1935
http_port: 8080

logging:
  level: info
